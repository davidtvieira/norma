server {
    listen 80;
    root /usr/share/nginx/html;

    # Spreadsheets and .nrm files are uploaded through here (the API accepts up to 10 MB).
    client_max_body_size 12m;

    # The API and its documentation (Swagger UI loads its definition from /v3/api-docs).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Built files carry a hash in their name, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app: any route (/d/..., /normas) serves index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
