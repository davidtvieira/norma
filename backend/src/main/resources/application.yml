spring:
  application:
    name: dataset-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

norma:
  cors:
    # Comma-separated exact origins (scheme+host+port), or "*" to allow any — see WebCorsConfig.
    # "*" here because this is reached through a proxy/tunnel whose host:port isn't fixed (the
    # dev machine's own origin, e.g. Vite's default port, would otherwise need listing too) —
    # only safe because that proxy already gates access itself (its own session/CSRF cookies).
    # Narrow this to an explicit origin list instead if this backend is ever reachable without
    # that gate in front of it.
    allowed-origins: "*"

springdoc:
  swagger-ui:
    path: /api/swagger
  api-docs:
    path: /v3/api-docs
