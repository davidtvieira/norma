# The database of the library of saved .nrm files. Start it with `docker compose up -d`; the backend's
# defaults (see backend/src/main/resources/application.yml) already point at it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: norma
      POSTGRES_USER: norma
      POSTGRES_PASSWORD: norma
    ports:
      - "5432:5432"
    volumes:
      - norma-db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  norma-db:
